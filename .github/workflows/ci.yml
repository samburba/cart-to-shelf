name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # The manifest is the one file a typo silently breaks: the extension just
      # refuses to load, with no test to catch it.
      - name: Validate manifest
        run: |
          node -e "
            const m = require('./manifest.json');
            const need = ['manifest_version','name','version','background','action','icons'];
            const missing = need.filter((k) => !(k in m));
            if (missing.length) throw new Error('manifest missing: ' + missing);
            if (!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error('bad version: ' + m.version);
            console.log('manifest ok, version', m.version);
          "

      - name: Check every referenced file exists
        run: |
          node -e "
            const fs = require('fs');
            const m = require('./manifest.json');
            const paths = [
              m.background.service_worker,
              ...(m.background.scripts || []),
              m.action.default_popup,
              ...Object.values(m.icons),
              ...Object.values(m.action.default_icon || {}),
            ];
            const missing = [...new Set(paths)].filter((p) => !fs.existsSync(p));
            if (missing.length) throw new Error('manifest points at missing files: ' + missing);
            console.log('all', paths.length, 'referenced files present');
          "
