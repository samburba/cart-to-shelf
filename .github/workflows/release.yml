name: Release

# Tag-driven: `npm run release 1.1.0` tags and pushes, this does the rest.
#
# Store submission is opt-in per run. Without the secrets configured it still
# builds, tests, and publishes the GitHub release — you just upload the zip by
# hand. Nothing here can publish a version the tag does not match.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_chrome:
        description: 'Submit to the Chrome Web Store'
        type: boolean
        default: false
      publish_firefox:
        description: 'Submit to Firefox AMO'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # A tag that disagrees with the manifest is how a release goes out with
      # the wrong version and can never be corrected — store versions are
      # write-once, even after a rejection.
      - name: Tag must match manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./manifest.json').version")
          echo "tag=$TAG manifest=$MANIFEST"
          [ "$TAG" = "$MANIFEST" ] || { echo "::error::tag $TAG != manifest $MANIFEST"; exit 1; }

      - run: npm run build

      - name: Attach the zip to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: cart-to-shelf.zip
          generate_release_notes: true

      # --- Chrome Web Store -------------------------------------------------
      # Secrets: CHROME_EXTENSION_ID, CHROME_CLIENT_ID, CHROME_CLIENT_SECRET,
      # CHROME_REFRESH_TOKEN. See STORE.md for how to mint them.
      - name: Upload to the Chrome Web Store
        if: >-
          (startsWith(github.ref, 'refs/tags/') || inputs.publish_chrome) &&
          env.CHROME_EXTENSION_ID != ''
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d client_id="$CHROME_CLIENT_ID" \
            -d client_secret="$CHROME_CLIENT_SECRET" \
            -d refresh_token="$CHROME_REFRESH_TOKEN" \
            -d grant_type=refresh_token | node -p "JSON.parse(require('fs').readFileSync(0)).access_token")

          echo "Uploading…"
          curl -sS -f -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -T cart-to-shelf.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CHROME_EXTENSION_ID"

          echo "Submitting for review…"
          curl -sS -f -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CHROME_EXTENSION_ID/publish"

      # --- Firefox AMO ------------------------------------------------------
      # Secrets: AMO_JWT_ISSUER, AMO_JWT_SECRET.
      - name: Upload to Firefox AMO
        if: >-
          (startsWith(github.ref, 'refs/tags/') || inputs.publish_firefox) &&
          env.AMO_JWT_ISSUER != ''
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          npx --yes web-ext@8 sign \
            --channel=listed \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET" \
            --source-dir=. \
            --ignore-files 'test/**' 'fixtures/**' 'docs/**' 'node_modules/**' '*.zip' '*.md'
